<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis is Good 🤖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 3rem 2rem;
    }
    .emoji { font-size: 5rem; margin-bottom: 1rem; animation: bounce 1.5s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 {
      font-size: 3rem;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      color: #aac8f0;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      color: #7fd8ff;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🤖</div>
    <h1>Jarvis is Good!</h1>
    <p>這個頁面由 Jarvis AI 自動建立並部署</p>
    <div class="badge">✨ Powered by GitHub Pages</div>
    <br/>
    <a href="todo.html" style="display:inline-block;margin-top:1.2rem;padding:0.6rem 1.8rem;border-radius:999px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#7fd8ff;text-decoration:none;font-size:0.95rem;backdrop-filter:blur(10px);transition:background 0.2s;" onmouseover="this.style.background='rgba(0,210,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">📝 任務清單</a>
  </div>
</body>
</html>
